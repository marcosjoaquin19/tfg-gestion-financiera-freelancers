# Una sola dirección para todo: /api/... va a la API y el resto es la pantalla.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Las redirecciones salen relativas: si nginx les pone dirección completa,
    # usa http:// y su puerto interno, y detrás del túnel (https) no sirven.
    absolute_redirect off;

    # Los extractos que se importan pueden pesar más que el máximo de nginx (1 MB).
    client_max_body_size 20m;

    location /api/ {
        # La barra final le saca el /api: /api/gastos/ llega a la API como /gastos/.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # La primera proyección (Prophet) puede tardar más que el minuto por defecto.
        proxy_read_timeout 300s;
        # Si la API redirige (por ejemplo /gastos → /gastos/), le vuelve a poner
        # el /api para que el navegador no caiga en la pantalla.
        proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /api/$1;
    }

    # Las rutas de la pantalla (/gastos, /monotributo...) las resuelve React.
    location / {
        try_files $uri /index.html;
    }
}
