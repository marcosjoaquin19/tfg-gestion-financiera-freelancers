services:

  db:                          # contenedor de PostgreSQL
    image: postgres:15
    container_name: tfg_db
    restart: unless-stopped
    environment:               # credenciales tomadas del archivo .env, nunca escritas acá
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"  # solo desde esta computadora, no desde la red
    volumes:
      - postgres_data:/var/lib/postgresql/data  # guarda los datos aunque apagues Docker
    healthcheck:               # se marca "healthy" recién cuando Postgres acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:                         # contenedor de tu API FastAPI
    build: .                   # construye la imagen desde este proyecto
    container_name: tfg_api
    ports:
      - "127.0.0.1:8000:8000"  # tu API va a estar en localhost:8000 (solo desde esta computadora)
    restart: on-failure        # si la DB aún no estaba lista, reintenta solo
    depends_on:
      db:
        condition: service_healthy  # arranca recién cuando Postgres está sano (evita la race del 1er arranque)
    env_file:
      - .env                   # usa las variables de tu archivo .env

  frontend:
    build: ./frontend
    container_name: tfg_frontend
    ports:
      - "127.0.0.1:3000:3000"  # la aplicación, solo desde esta computadora
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:               # volumen para persistir los datos de PostgreSQL